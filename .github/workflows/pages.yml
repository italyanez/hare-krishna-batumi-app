# Публикует папку dist/ на GitHub Pages при каждом обновлении ветки main
name: Публикация на GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Сборка и публикация разделены на два шага (как в официальном шаблоне GitHub):
  # шаг публикации стартует, только когда архив сайта уже точно сохранён.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Проверить content.json
        run: python3 -c "import json; json.load(open('dist/content.json'))"
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
